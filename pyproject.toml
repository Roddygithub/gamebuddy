[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamebuddy"
version = "0.6.4"
description = "Voice-first AI gaming companion for Linux (Wayland/Hyprland/Omarchy). Talk to Buddy while you play."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Roddy Salardon" }]
keywords = ["gaming", "assistant", "voice", "overlay", "wayland", "hyprland", "omarchy"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "PySide6>=6.6",
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "openai>=1.40",
  "anthropic>=0.40",
  "httpx>=0.25",
  "ddgs>=9.0",
  "pillow>=10",
  "tomli-w>=1.0",
  "jeepney>=0.8; sys_platform == 'linux'",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0", "av<19"]
x11 = ["pynput>=1.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gamebuddy = "gamebuddy.cli:main"

[project.urls]
Homepage = "https://github.com/Roddygithub/gamebuddy"
Issues = "https://github.com/Roddygithub/gamebuddy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamebuddy = ["assets/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
