name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for Qt offscreen + portaudio
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libportaudio2 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Omarchy plugin manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.load(open("manifest.json"))
          assert m["schemaVersion"] == 1
          assert m["id"] == "io.github.roddygithub.gamebuddy"
          assert m["entryPoints"]["barWidget"] == "BarWidget.qml"
          for path in ("BarWidget.qml", "README.md", "install.sh", "LICENSE", "packaging/gamebuddy-update.timer", "packaging/gamebuddy-update.service"):
              assert Path(path).is_file(), path
          PY
      - name: Shell syntax
        run: bash -n install.sh
