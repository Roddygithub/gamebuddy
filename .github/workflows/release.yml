name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches pyproject version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject v$v"; exit 1; }
      - name: Changelog section
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {p=1; next} /^## /{p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
